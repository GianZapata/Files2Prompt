name: Publish Extension

on:
  push:
    tags: ['v*']

env:
  NODE_VERSION: 24.x

permissions:
  contents: read

jobs:
  publish:
    name: Package and publish
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npx vsce package --out promptfold.vsix
      - name: Record SHA-256
        run: sha256sum promptfold.vsix | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish to the Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath promptfold.vsix -p "$VSCE_PAT"
      - name: Skip the Visual Studio Marketplace
        if: env.VSCE_PAT == ''
        run: echo "::warning::VSCE_PAT is not set, so nothing was published to the Visual Studio Marketplace."
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish promptfold.vsix -p "$OVSX_PAT"
      - name: Skip Open VSX
        if: env.OVSX_PAT == ''
        run: echo "::warning::OVSX_PAT is not set, so nothing was published to Open VSX."
